<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <p class="subtitle">Serverless AWS App — S3 + CloudFront + Lambda + DynamoDB</p>

    <!-- Add Task Form -->
    <form id="task-form" class="task-form">
      <input type="text" id="task-title" placeholder="What needs to be done?" required>
      <input type="text" id="task-desc" placeholder="Description (optional)">
      <button type="submit">Add Task</button>
    </form>

    <!-- Filter Buttons -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <!-- Task List -->
    <ul id="task-list" class="task-list"></ul>

    <!-- Status Message -->
    <p id="status-msg" class="status-msg"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
